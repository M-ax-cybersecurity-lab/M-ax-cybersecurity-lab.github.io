backend:
  name: github
  repo: m-ax-lab/lab-website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "사이트 기본 정보"
    files:
      - name: "site"
        label: "사이트 기본 정보"
        file: "content/site.json"
        fields:
          - { label: "연구실 이름 (국문)", name: "labNameKo", widget: "string" }
          - { label: "Lab Name (English)", name: "labNameEn", widget: "string" }
          - { label: "학교", name: "university", widget: "string" }
          - { label: "학과", name: "department", widget: "string" }
          - { label: "배너 이미지", name: "bannerImage", widget: "image", required: false }
          - { label: "문의 이메일", name: "contactEmail", widget: "string" }
          - { label: "주소", name: "address", widget: "string" }
          - label: "소셜 링크"
            name: "socialLinks"
            widget: "object"
            fields:
              - { label: "GitHub", name: "github", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }

  - name: "nav"
    label: "메뉴"
    files:
      - name: "nav"
        label: "메뉴 라벨"
        file: "content/nav.json"
        fields:
          - { label: "About", name: "navAbout", widget: "string" }
          - { label: "About > Welcome", name: "navWelcome", widget: "string" }
          - { label: "About > Benefits", name: "navBenefits", widget: "string" }
          - { label: "About > Contact us", name: "navContactUs", widget: "string" }
          - { label: "People", name: "navPeople", widget: "string" }
          - { label: "Research", name: "navResearch", widget: "string" }
          - { label: "Research > Areas", name: "navAreas", widget: "string" }
          - { label: "Research > Projects", name: "navProjects", widget: "string" }
          - { label: "Research > Facility", name: "navFacility", widget: "string" }
          - { label: "Publications", name: "navPublications", widget: "string" }
          - { label: "News", name: "navNews", widget: "string" }

  - name: "about"
    label: "About"
    files:
      - name: "about"
        label: "About"
        file: "content/about.json"
        fields:
          - { label: "Welcome 이용구", name: "welcomeEyebrow", widget: "string" }
          - { label: "Welcome 제목", name: "welcomeTitle", widget: "string" }
          - { label: "태그라인", name: "tagline", widget: "string" }
          - { label: "환영 메시지", name: "welcomeMessage", widget: "text" }
          - name: "welcomeCards"
            label: "Welcome 카드 목록"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }
          - { label: "Benefits 이용구", name: "benefitsEyebrow", widget: "string" }
          - { label: "Benefits 제목", name: "benefitsTitle", widget: "string" }
          - { label: "Benefits 설명 문구", name: "benefitsDesc", widget: "string" }
          - name: "benefits"
            label: "Benefits 혜택 목록"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }
          - { label: "Contact 제목", name: "contactTitle", widget: "string" }
          - { label: "Contact 버튼 텍스트", name: "contactButtonLabel", widget: "string" }

  - name: "people"
    label: "People"
    files:
      - name: "people"
        label: "People"
        file: "content/people.json"
        fields:
          - { label: "이용구", name: "peopleEyebrow", widget: "string" }
          - { label: "제목", name: "peopleTitle", widget: "string" }
          - { label: "설명 문구", name: "peopleDesc", widget: "string" }
          - name: "people"
            label: "구성원"
            widget: "list"
            summary: "{{name}} ({{role}})"
            fields:
              - label: "역할"
                name: "role"
                widget: "select"
                options: ["Professor", "PhD", "MS", "Alumni"]
              - { label: "이름", name: "name", widget: "string" }
              - { label: "직함", name: "title", widget: "string" }
              - { label: "사진", name: "photo", widget: "image", required: false }
              - { label: "이메일", name: "email", widget: "string", required: false }
              - { label: "소개", name: "bio", widget: "text", required: false }
              - { label: "상세 약력 (클릭 시 표시, Professor만 해당)", name: "cv", widget: "text", required: false }
              - label: "링크"
                name: "links"
                widget: "object"
                required: false
                fields:
                  - { label: "Google Scholar", name: "scholar", widget: "string", required: false }
                  - { label: "GitHub", name: "github", widget: "string", required: false }
                  - { label: "홈페이지", name: "homepage", widget: "string", required: false }

  - name: "research"
    label: "Research"
    files:
      - name: "research"
        label: "Research"
        file: "content/research.json"
        fields:
          - { label: "이용구", name: "researchEyebrow", widget: "string" }
          - { label: "Areas 제목", name: "areasTitle", widget: "string" }
          - { label: "Areas 설명 문구", name: "areasDesc", widget: "string" }
          - name: "areas"
            label: "Areas (연구 분야)"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }
          - { label: "Projects 제목", name: "projectsTitle", widget: "string" }
          - { label: "Projects 설명 문구", name: "projectsDesc", widget: "string" }
          - name: "projects"
            label: "Projects (연구 프로젝트)"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "기간", name: "period", widget: "string", required: false }
              - { label: "지원기관", name: "funding", widget: "string", required: false }
              - { label: "요약 설명 (카드에 표시)", name: "description", widget: "text" }
              - { label: "사진", name: "image", widget: "image", required: false }
              - { label: "상세 설명 (클릭 시 모달에 표시)", name: "detail", widget: "text", required: false }
          - { label: "Facility 제목", name: "facilityTitle", widget: "string" }
          - { label: "Facility 설명 문구", name: "facilityDesc", widget: "string" }
          - name: "facility"
            label: "Facility (보유 장비/공간)"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
              - { label: "요약 설명 (카드에 표시)", name: "description", widget: "text" }
              - { label: "사진", name: "image", widget: "image", required: false }
              - { label: "상세 설명 (클릭 시 모달에 표시)", name: "detail", widget: "text", required: false }

  - name: "publications"
    label: "Publications"
    files:
      - name: "publications"
        label: "Publications"
        file: "content/publications.json"
        fields:
          - { label: "이용구", name: "publicationsEyebrow", widget: "string" }
          - { label: "제목", name: "publicationsTitle", widget: "string" }
          - name: "publications"
            label: "연도별 논문 목록"
            widget: "list"
            summary: "{{year}}"
            fields:
              - { label: "연도", name: "year", widget: "number", value_type: "int" }
              - label: "논문 목록"
                name: "items"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "구분 (예: International Journal)", name: "type", widget: "string" }
                  - { label: "저자", name: "authors", widget: "string" }
                  - { label: "제목", name: "title", widget: "string" }
                  - { label: "저널/학회 정보", name: "venue", widget: "string" }
                  - { label: "링크", name: "link", widget: "string", required: false }

  - name: "news"
    label: "News"
    files:
      - name: "news"
        label: "News"
        file: "content/news.json"
        fields:
          - { label: "이용구", name: "newsEyebrow", widget: "string" }
          - { label: "제목", name: "newsTitle", widget: "string" }
          - name: "news"
            label: "공지 목록"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "내용", name: "content", widget: "text" }
              - { label: "링크", name: "link", widget: "string", required: false }
