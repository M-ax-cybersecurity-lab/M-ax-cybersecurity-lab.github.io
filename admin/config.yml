backend:
  name: github
  repo: m-ax-lab/lab-website
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "사이트 기본 정보"
    files:
      - name: "site"
        label: "사이트 기본 정보"
        file: "content/site.json"
        fields:
          - { label: "연구실 이름 (국문)", name: "labNameKo", widget: "string" }
          - { label: "Lab Name (English)", name: "labNameEn", widget: "string" }
          - { label: "학교", name: "university", widget: "string" }
          - { label: "학과", name: "department", widget: "string" }
          - { label: "태그라인", name: "tagline", widget: "string" }
          - { label: "배너 이미지", name: "bannerImage", widget: "image", required: false }
          - { label: "환영 메시지", name: "welcomeMessage", widget: "text" }
          - { label: "문의 이메일", name: "contactEmail", widget: "string" }
          - { label: "주소", name: "address", widget: "string" }
          - label: "소셜 링크"
            name: "socialLinks"
            widget: "object"
            fields:
              - { label: "GitHub", name: "github", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }

  - name: "people"
    label: "People"
    files:
      - name: "people"
        label: "People"
        file: "content/people.json"
        fields:
          - name: "people"
            label: "구성원"
            widget: "list"
            summary: "{{name}} ({{role}})"
            fields:
              - label: "역할"
                name: "role"
                widget: "select"
                options: ["Professor", "PhD", "MS", "Alumni"]
              - { label: "이름", name: "name", widget: "string" }
              - { label: "직함", name: "title", widget: "string" }
              - { label: "사진", name: "photo", widget: "image", required: false }
              - { label: "이메일", name: "email", widget: "string", required: false }
              - { label: "소개", name: "bio", widget: "text", required: false }
              - { label: "상세 약력 (클릭 시 표시, Professor만 해당)", name: "cv", widget: "text", required: false }
              - label: "링크"
                name: "links"
                widget: "object"
                required: false
                fields:
                  - { label: "Google Scholar", name: "scholar", widget: "string", required: false }
                  - { label: "GitHub", name: "github", widget: "string", required: false }
                  - { label: "홈페이지", name: "homepage", widget: "string", required: false }

  - name: "research"
    label: "Research"
    files:
      - name: "research"
        label: "Research"
        file: "content/research.json"
        fields:
          - name: "areas"
            label: "Areas (연구 분야)"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }
          - name: "projects"
            label: "Projects (연구 프로젝트)"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "기간", name: "period", widget: "string", required: false }
              - { label: "지원기관", name: "funding", widget: "string", required: false }
              - { label: "요약 설명 (카드에 표시)", name: "description", widget: "text" }
              - { label: "사진", name: "image", widget: "image", required: false }
              - { label: "상세 설명 (클릭 시 모달에 표시)", name: "detail", widget: "text", required: false }
          - name: "facility"
            label: "Facility (보유 장비/공간)"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "이름", name: "name", widget: "string" }
              - { label: "요약 설명 (카드에 표시)", name: "description", widget: "text" }
              - { label: "사진", name: "image", widget: "image", required: false }
              - { label: "상세 설명 (클릭 시 모달에 표시)", name: "detail", widget: "text", required: false }

  - name: "benefits"
    label: "Benefits (제공 혜택)"
    files:
      - name: "benefits"
        label: "Benefits"
        file: "content/benefits.json"
        fields:
          - name: "benefits"
            label: "혜택 목록"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }

  - name: "publications"
    label: "Publications"
    files:
      - name: "publications"
        label: "Publications"
        file: "content/publications.json"
        fields:
          - name: "publications"
            label: "연도별 논문 목록"
            widget: "list"
            summary: "{{year}}"
            fields:
              - { label: "연도", name: "year", widget: "number", value_type: "int" }
              - label: "논문 목록"
                name: "items"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "구분 (예: International Journal)", name: "type", widget: "string" }
                  - { label: "저자", name: "authors", widget: "string" }
                  - { label: "제목", name: "title", widget: "string" }
                  - { label: "저널/학회 정보", name: "venue", widget: "string" }
                  - { label: "링크", name: "link", widget: "string", required: false }

  - name: "news"
    label: "News"
    files:
      - name: "news"
        label: "News"
        file: "content/news.json"
        fields:
          - name: "news"
            label: "공지 목록"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "날짜", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "내용", name: "content", widget: "text" }
              - { label: "링크", name: "link", widget: "string", required: false }
