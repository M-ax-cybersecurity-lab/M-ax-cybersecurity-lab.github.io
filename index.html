<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{labNameKo}} | 한국해양대학교 해사인공지능보안학과</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="hero" id="welcome">
  <div class="container">
    <div class="hero-eyebrow">해사인공지능보안학과 · 사이버보안전공</div>
    <h1 data-site-field="labNameKo">해사 AX 보안공학 연구실</h1>
    <p data-site-field="welcomeMessage">저희 연구실을 소개합니다.</p>
    <div class="hero-meta">
      <span data-site-field="university">한국해양대학교</span>
      <span data-site-field="department">해사인공지능보안학과 (사이버보안전공)</span>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="section-eyebrow">Welcome</div>
    <h2 class="section-title">연구실 소개</h2>
    <p class="section-desc" data-site-field="tagline">Maritime AI & Cybersecurity Research</p>
    <div class="card-grid" id="welcome-areas-mount"></div>
  </div>
</section>

<section class="section section-alt">
  <div class="container">
    <div class="section-eyebrow">Benefits</div>
    <h2 class="section-title">제공 혜택</h2>
    <p class="section-desc">연구실 구성원에게 제공하는 지원 사항입니다.</p>
    <div class="card-grid" id="benefits-mount"></div>
  </div>
</section>

<section class="section" id="contact">
  <div class="container">
    <div class="contact-box">
      <div>
        <h2 class="section-title" style="color:#fff;">Contact us</h2>
        <p data-site-field="address">주소가 표시됩니다.</p>
      </div>
      <a class="btn" href="#" data-site-mailto>이메일로 문의하기</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="/assets/js/main.js" defer></script>
<script src="/assets/js/content.js" defer></script>
</body>
</html>
